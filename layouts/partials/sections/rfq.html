{{- /* sections/rfq.html — Request for Quote form section
   Renders RFQ form. Also available as shortcode {{< rfq_form >}}. */ -}}
<section class="section section-rfq" id="rfq">
  <div class="container">
    <h2 class="section-title">Request a Quote</h2>
    <p class="section-description">Fill out the form below and our team will get back to you within 24 hours.</p>
    <form class="rfq-form" method="POST" action="mailto:{{ .Site.Params.contact.email | default "contact@example.com" }}" enctype="text/plain">
      <div class="form-row">
        <div class="form-group">
          <label for="rfq-name">Name *</label>
          <input type="text" id="rfq-name" name="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="rfq-company">Company</label>
          <input type="text" id="rfq-company" name="company" placeholder="Company name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="rfq-email">Email *</label>
          <input type="email" id="rfq-email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="rfq-phone">Phone</label>
          <input type="tel" id="rfq-phone" name="phone" placeholder="+1 234 567 890">
        </div>
      </div>
      <div class="form-group">
        <label for="rfq-material">Material</label>
        <input type="text" id="rfq-material" name="material" placeholder="e.g. Aluminum ADC12">
      </div>
      <div class="form-group">
        <label for="rfq-quantity">Estimated Quantity</label>
        <input type="number" id="rfq-quantity" name="quantity" placeholder="e.g. 10000">
      </div>
      <div class="form-group">
        <label for="rfq-message">Project Details *</label>
        <textarea id="rfq-message" name="message" rows="5" required placeholder="Describe your project requirements, dimensions, tolerances, etc."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-submit">Submit Quote Request</button>
    </form>
  </div>
</section>
