# ==========================================================================
# params.toml — TechCarbonWorks Site Parameters
# ==========================================================================

# SEO defaults (must be before any [section] header)
description = "TechCarbonWorks is a custom carbon fiber parts manufacturer providing OEM composite manufacturing, carbon fiber prototyping, CNC machining and advanced composite solutions for UAV, aerospace, motorsport and robotics industries worldwide."
keywords = ["carbon fiber parts manufacturer", "custom carbon fiber parts", "OEM composite manufacturing", "carbon fiber prototyping", "CNC machining carbon fiber", "carbon fiber mold making"]

[Author]
  name = "TechCarbonWorks"
  email = "hank@techcarbonworks.com"

# Contact information (used in footer and schema)
[contact]
  email = "hank@techcarbonworks.com"
  phone = ""
  address = "1st Floor, Building 1, No. 76, Jinqiu Road, Qiuchang, Huiyang District, Huizhou City, Guangdong Province, China"

# Social media (used in schema sameAs)
[social]
  linkedin = ""
  twitter = ""
  youtube = ""

# Feature flags
[features]
  enableSearch = false
  enableBlog = false
  enableRFQ = true
  enableMultilingual = true

# Google Analytics (gtag.js)
[analytics]
  google_analytics_id = "G-0ZJ5T5H42Z"

# Homepage configuration
[homepage]
  showServices = true
  showIndustries = true
  showCertifications = true
  showProcess = true

# Footer configuration
[footer]
  copyright = "TechCarbonWorks. All rights reserved."
  showLegalLinks = true

# --- Image architecture defaults (PHASE 4.6) ---
# default_hero / default_og currently point to the LEGACY WordPress photo as a
# transitional fallback ONLY. REPLACE both with self-hosted local paths under
# /images/... (served from blog.techcarbonworks.com) in PHASE 4.7.
# Do NOT treat techcarbonworks.com as the final image host.
[images]
  default_hero = "/images/hero-carbon-fiber-manufacturing.webp"
  default_og = "/images/og-carbon-fiber-manufacturing.webp"
  default_og_width = 1200
  default_og_height = 630
  default_og_type = "image/webp"
  default_alt = "TechCarbonWorks carbon fiber composite manufacturing facility"

# --- RFQ form configuration (Formspree backend) ---
# The RFQ shortcode ({{< rfq_form >}}) and the `rfq` landing section read
# `.Site.Params.rfq.endpoint`. No website domain is hardcoded here — redirect
# targets are resolved with Hugo absURL at render time.
[rfq]
  enabled = true
  provider = "formspree"
  endpoint = "https://formspree.io/f/mqerjlky"
  email = "hank@techcarbonworks.com"
  success = "/thank-you/"
