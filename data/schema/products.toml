# ==========================================================================
# products.toml — TechCarbonWorks Materials & Product Families [SITE LAYER]
# ==========================================================================
# Feeds Product schema, material specification sections, and the
# materials showcase. Each entry carries material_grades used by the
# materials and specification landing sections.
