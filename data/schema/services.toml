# ==========================================================================
# services.toml — TechCarbonWorks Service Catalog [SITE LAYER]
# ==========================================================================
# Each service needs:
#   - id: unique identifier (kebab-case, matches content directory name)
#   - schema_type: "Service" (standard)
#   - url_path: must match the content directory path (e.g. "/your-service/")
#   - sort_order: display order
# Then add localized name/description under [en.<id>].
# Industry-specific landing pages are registered as services too, so each
# receives a Service JSON-LD entity via the GEO Schema Engine.
# ==========================================================================

# --- Service catalog (language-neutral IDs) ---

[[services]]
